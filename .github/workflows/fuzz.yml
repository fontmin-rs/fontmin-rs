name: Fuzz

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/fuzz.yml'
      - 'crates/**'
      - 'fixtures/malformed/**'
      - 'fuzz/**'
      - 'scripts/*fuzz*'
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/fuzz.yml'
      - 'crates/**'
      - 'fixtures/malformed/**'
      - 'fuzz/**'
      - 'scripts/*fuzz*'
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fuzz-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'schedule' }}

jobs:
  address-sanitizer:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        target:
          - parsers
          - converters
          - configuration
          - output_naming
          - public_api
    env:
      FUZZ_SECONDS: ${{ github.event_name == 'schedule' && '300' || '30' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@4fd1da8b0805d2d2e936788875a7d65dbd677dc2 # nightly
      - uses: taiki-e/install-action@41049aa56687c35e0afa74eed4f09cec4f9afabf # v2
        with:
          tool: cargo-fuzz

      - run: node scripts/prepare-fuzz-corpus.mjs
      - id: fuzz
        continue-on-error: true
        run: >-
          RUSTC="$(rustup which --toolchain nightly rustc)"
          cargo fuzz run ${{ matrix.target }}
          --target x86_64-unknown-linux-gnu
          --sanitizer address --
          -max_total_time=${FUZZ_SECONDS}
          -max_len=1048576
          -timeout=10
          -rss_limit_mb=4096
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: steps.fuzz.outcome == 'failure'
        with:
          name: fuzz-artifacts-${{ matrix.target }}
          path: fuzz/artifacts/${{ matrix.target }}
          if-no-files-found: ignore
      - name: Fail when fuzzing found a regression
        if: steps.fuzz.outcome == 'failure'
        run: exit 1

  promote-regression:
    if: >-
      always() &&
      needs['address-sanitizer'].result == 'failure' &&
      github.event_name != 'pull_request'
    needs: [address-sanitizer]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@4fd1da8b0805d2d2e936788875a7d65dbd677dc2 # nightly
      - uses: taiki-e/install-action@41049aa56687c35e0afa74eed4f09cec4f9afabf # v2
        with:
          tool: cargo-fuzz
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: fuzz-artifacts-*
          path: fuzz/downloaded

      - name: Minimize fuzz artifacts
        shell: bash
        run: |
          shopt -s nullglob
          found=0

          for target in parsers converters configuration output_naming public_api; do
            artifacts=(fuzz/downloaded/fuzz-artifacts-"$target"/*)
            if (( ${#artifacts[@]} == 0 )); then
              continue
            fi

            found=1
            mkdir -p "fuzz/minimized/$target"
            for artifact in "${artifacts[@]}"; do
              output="fuzz/minimized/$target/$(basename "$artifact")"
              RUSTC="$(rustup which --toolchain nightly rustc)" \
                cargo fuzz tmin "$target" "$artifact" \
                --target x86_64-unknown-linux-gnu \
                --sanitizer address -- \
                -exact_artifact_path="$output" \
                -max_total_time=120 \
                -timeout=10 \
                -rss_limit_mb=4096
            done
          done

          if (( found == 0 )); then
            echo "No fuzz artifacts were uploaded." >&2
            exit 1
          fi

      - name: Promote permanent regressions
        shell: bash
        run: |
          shopt -s nullglob

          for target in parsers converters configuration output_naming public_api; do
            artifacts=(fuzz/minimized/"$target"/*)
            if (( ${#artifacts[@]} == 0 )); then
              continue
            fi

            node scripts/promote-fuzz-artifacts.mjs \
              --target "$target" \
              --artifacts "fuzz/minimized/$target" \
              --regressions "fuzz/regressions/$target"
          done

      - name: Create corpus promotion pull request
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if git diff --quiet -- fuzz/regressions; then
            echo "The minimized regression is already permanent."
            exit 0
          fi

          branch="codex/fuzz-corpus-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add fuzz/regressions
          git commit -m "test(fuzz): preserve minimized regression"
          git push origin "$branch"
          if gh pr create \
            --base main \
            --head "$branch" \
            --title "test(fuzz): preserve minimized regression" \
            --body "Automated promotion from ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}. The regression remains red until its parser fix and stable diagnostic are added. Tracks #3 and #4."; then
            exit 0
          fi

          manual_pr_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/compare/main...${branch}?expand=1"
          echo "::warning::The organization blocked automatic pull request creation; opening a tracking issue instead."
          gh issue create \
            --title "test(fuzz): review regression from run ${GITHUB_RUN_ID}" \
            --body "GitHub Actions preserved the minimized regression on branch ${branch}, but the organization blocked automatic pull request creation. Review run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}. Open pull request: ${manual_pr_url}. The regression remains red until its parser fix and stable diagnostic are added. Tracks #3 and #4."
