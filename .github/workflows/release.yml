name: Release

permissions:
  contents: read

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@b0f76dfb45f55f8421693e4803ac7bb65143bd34 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.x
          cache: pnpm
      - uses: dtolnay/rust-toolchain@46511b1c83438f0dd37c02d843619ece5a4abb5b # 1.97.1
        with:
          components: clippy,rustfmt,llvm-tools-preview
          targets: wasm32-unknown-unknown
      - uses: taiki-e/install-action@41049aa56687c35e0afa74eed4f09cec4f9afabf # v2
        with:
          tool: wasm-pack@0.15.0
      - uses: taiki-e/install-action@41049aa56687c35e0afa74eed4f09cec4f9afabf # v2
        with:
          tool: cargo-deny
      - uses: taiki-e/install-action@41049aa56687c35e0afa74eed4f09cec4f9afabf # v2
        with:
          tool: cargo-llvm-cov

      - run: pnpm install --frozen-lockfile
      - run: pnpm run release:metadata -- --tag "${{ github.ref_name }}"
      - run: pnpm -C wasm/fontmin run build
      - run: pnpm run check
      - run: pnpm run security:check
      - run: pnpm run coverage:check
      - run: pnpm run package:smoke
      - run: pnpm --filter fontmin-rs exec playwright install --with-deps chromium
      - run: pnpm run compatibility:report
      - run: pnpm --filter fontmin-rs test:browser
      - run: pnpm --filter @fontmin-rs/wasm test:browser
      - run: pnpm run release:pack

  build-native:
    runs-on: ${{ matrix.os }}
    needs: [verify]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: windows-latest
            target: aarch64-pc-windows-msvc
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            build_args: --use-napi-cross
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            build_args: --cross-compile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@b0f76dfb45f55f8421693e4803ac7bb65143bd34 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.x
          cache: pnpm
      - uses: dtolnay/rust-toolchain@46511b1c83438f0dd37c02d843619ece5a4abb5b # 1.97.1
        with:
          targets: ${{ matrix.target }}
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        if: matrix.build_args == '--cross-compile'
        with:
          version: 0.15.2
      - uses: taiki-e/install-action@41049aa56687c35e0afa74eed4f09cec4f9afabf # v2
        if: matrix.build_args == '--cross-compile'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          tool: cargo-zigbuild

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @fontmin-rs/binding build --target ${{ matrix.target }} ${{ matrix.build_args }}
      - run: pnpm --filter @fontmin-rs/binding artifacts
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: bindings-${{ matrix.target }}
          path: npm/**/*.node
          if-no-files-found: error

  publish:
    runs-on: ubuntu-latest
    needs: [build-native]
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@b0f76dfb45f55f8421693e4803ac7bb65143bd34 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.x
          registry-url: https://registry.npmjs.org
      - uses: dtolnay/rust-toolchain@46511b1c83438f0dd37c02d843619ece5a4abb5b # 1.97.1
        with:
          targets: wasm32-unknown-unknown
      - uses: taiki-e/install-action@41049aa56687c35e0afa74eed4f09cec4f9afabf # v2
        with:
          tool: wasm-pack@0.15.0
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: bindings-*
          merge-multiple: true
      - name: Place downloaded native artifacts
        run: |
          shopt -s nullglob

          for dir in binding-*; do
            cp -R "$dir"/. "npm/$dir"/
          done
      - name: Verify native package artifacts
        run: |
          node --input-type=module <<'EOF'
          import { existsSync, readdirSync, readFileSync } from 'node:fs'
          import { join } from 'node:path'

          const missing = []

          for (const entry of readdirSync('npm', { withFileTypes: true })) {
            if (!entry.isDirectory()) {
              continue
            }

            const packageDir = join('npm', entry.name)
            const manifest = JSON.parse(
              readFileSync(join(packageDir, 'package.json'), 'utf8'),
            )

            for (const file of manifest.files ?? []) {
              if (!existsSync(join(packageDir, file))) {
                missing.push(`${manifest.name}: ${file}`)
              }
            }
          }

          if (missing.length > 0) {
            console.error(`Missing native artifacts:\n${missing.join('\n')}`)
            process.exit(1)
          }
          EOF
      - run: pnpm --filter fontmin-rs build
      - run: pnpm --filter @fontmin-rs/wasm build
      - run: pnpm run release:pack
      - name: Resolve npm dist-tag
        id: npm-dist-tag
        run: echo "value=$(node scripts/npm-dist-tag.mjs)" >> "$GITHUB_OUTPUT"
      - name: Publish npm packages
        run: pnpm -r publish --no-git-checks --access public --report-summary --tag "${{ steps.npm-dist-tag.outputs.value }}" --provenance
      - name: Create GitHub release
        run: node node_modules/changelogithub/cli.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
