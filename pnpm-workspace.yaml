packages:
  - docs
  - packages/*
  - napi/*
  - npm/*
  - wasm/*
  - tasks/*
  - examples/*

overrides:
  brace-expansion@<=5.0.8: ^5.0.9
  fast-uri@>=3.0.0 <3.1.5: ^3.1.5
  fast-xml-parser@<5.7.0: ^5.7.0
  ip-address@<=10.3.0: ^10.3.1
  js-yaml@>=4.0.0 <4.3.1: ^4.3.1
  nanoid@<3.3.17: ^3.3.17
  postcss@<=8.5.22: ^8.5.23
  tar: 7.5.22
  uuid@<11.1.1: ^11.1.1

allowBuilds:
  '@napi-rs/cli': true
  ttf2woff2: false

minimumReleaseAgeExclude:
  - '@napi-rs/*'
  - '@emnapi/*'
  - fontmin-rs

catalog:
  '@napi-rs/cli': ^3.7.3
  '@types/node': ^26.1.1
  tsdown: ^0.22.12
  typescript: ^7.0.2
  vitest: ^4.1.10

minimumReleaseAge: 0
ignoreWorkspaceRootCheck: true
packageManagerStrict: false
shellEmulator: true
