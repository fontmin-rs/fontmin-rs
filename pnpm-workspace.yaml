packages:
  - docs
  - packages/*
  - napi/*
  - npm/*
  - wasm/*
  - tasks/*
  - examples/*

overrides:
  brace-expansion@<5.0.12: ^5.0.12
  fast-uri@>=3.0.0 <3.1.8: ^3.1.8
  fast-xml-parser@<5.7.0: ^5.7.0
  http-cache-semantics@<4.2.1: ^4.2.1
  ip-address@<10.7.1: ^10.7.1
  js-yaml@>=4.0.0 <4.3.1: ^4.3.1
  nanoid@<3.3.17: ^3.3.17
  postcss@<=8.5.22: ^8.5.23
  shell-quote@>=1.8.4 <1.11.0: ^1.11.0
  source-map-js@>=1.0.0 <1.2.2: ^1.2.2
  tar: 7.5.22
  tinypool@<2.1.2: ^2.1.2
  uuid@<11.1.1: ^11.1.1

allowBuilds:
  '@napi-rs/cli': true
  ttf2woff2: false

minimumReleaseAgeExclude:
  - '@napi-rs/*'
  - '@emnapi/*'
  - fontmin-rs

catalog:
  '@napi-rs/cli': ^3.8.6
  '@types/node': ^26.4.0
  tsdown: ^0.22.14
  typescript: ^7.0.2
  vitest: ^4.1.11

minimumReleaseAge: 0
ignoreWorkspaceRootCheck: true
shellEmulator: true
